name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]   # NFR-07
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (one command, NFR-07)
        run: python -m pip install -e ".[dev]"

      - name: CLI smoke test
        run: actiontrack --help

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest --cov --cov-report=term-missing
