[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actiontrack"
version = "0.1.0"
description = "Collect action items from markdown meeting notes, track them, and prepare follow-up Gmail drafts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
actiontrack = "actiontrack.cli:main"

[tool.setuptools.packages.find]
include = ["actiontrack*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "edge(case_id): links a test to a requirement edge case (E1-E11)",
    "perf: performance test (NFR-03)",
    "fuzz: robustness test with random input (NFR-01)",
    "safety: never-send guarantees (NFR-02)",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["actiontrack"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]  # docs contain illustrative, not runnable, code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
